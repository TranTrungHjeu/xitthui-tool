<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MindX LMS Bot - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                50: "#eff6ff",
                100: "#dbeafe",
                200: "#bfdbfe",
                500: "#3b82f6",
                600: "#2563eb",
                700: "#1d4ed8",
                800: "#1e40af",
              },
            },
          },
        },
      };
    </script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap");
      * {
        font-family: "Inter", system-ui, sans-serif;
      }
      body {
        background: #f1f5f9;
        min-height: 100vh;
      }
      .glass {
        background: rgba(255, 255, 255, 0.97);
        backdrop-filter: blur(12px);
      }
      .fade-in {
        animation: fadeIn 0.3s ease-out;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .slide-down {
        animation: slideDown 0.25s ease-out;
      }
      @keyframes slideDown {
        from {
          opacity: 0;
          max-height: 0;
        }
        to {
          opacity: 1;
          max-height: 2000px;
        }
      }
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f5f9;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 3px;
      }
      .lms-content {
        font-size: 0.875rem;
        line-height: 1.6;
        color: #334155;
      }
      .lms-content p {
        margin-bottom: 0.75rem;
      }
      .lms-content ul {
        list-style-type: disc;
        margin-left: 1.5rem;
        margin-bottom: 0.75rem;
      }
      .lms-content ol {
        list-style-type: decimal;
        margin-left: 1.5rem;
        margin-bottom: 0.75rem;
      }
      .lms-content li {
        margin-bottom: 0.25rem;
      }
      .lms-content strong {
        font-weight: 700;
        color: #1e293b;
      }
      .lms-content .ql-indent-1 {
        padding-left: 1.5rem;
      }
      .lms-content .ql-indent-2 {
        padding-left: 3rem;
      }
      .lms-content .ql-ui {
        display: none;
      }
      .lms-content table {
        border-collapse: collapse;
        width: 100%;
        margin-bottom: 1rem;
        background: white;
      }
      .lms-content td,
      .lms-content th {
        border: 1px solid #e2e8f0;
        padding: 0.5rem 0.75rem;
        text-align: left;
      }
      .lms-content th {
        background: #f8fafc;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      const { useState, useEffect, useCallback, useMemo } = React;

      /* ─── Utilities ─── */
      const api = async (url, body) => {
        const opts = body
          ? {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(body),
            }
          : {};
        const r = await fetch(url, opts);
        return r.json();
      };

      const fmtDate = (d) => {
        if (!d) return "—";
        const dt = new Date(d);
        return dt.toLocaleDateString("vi-VN", {
          day: "2-digit",
          month: "2-digit",
          year: "numeric",
        });
      };

      const fmtTime = (d) => {
        if (!d) return "";
        const dt = new Date(d);
        return dt.toLocaleTimeString("vi-VN", {
          hour: "2-digit",
          minute: "2-digit",
        });
      };

      const statusColor = (s) => {
        const map = {
          RUNNING: "bg-emerald-100 text-emerald-700",
          FINISHED: "bg-gray-100 text-gray-600",
          PENDING: "bg-yellow-100 text-yellow-700",
          CANCELLED: "bg-red-100 text-red-600",
          ACTIVE: "bg-emerald-100 text-emerald-700",
        };
        return map[s] || "bg-gray-100 text-gray-500";
      };

      const attendanceIcon = (status) => {
        const map = {
          PRESENT: { icon: "fa-check-circle", color: "text-emerald-500" },
          ATTENDED: { icon: "fa-check-circle", color: "text-emerald-500" },
          ABSENT: { icon: "fa-times-circle", color: "text-red-500" },
          ABSENT_WITH_NOTICE: {
            icon: "fa-info-circle",
            color: "text-blue-500",
          },
          LATE: { icon: "fa-clock", color: "text-yellow-500" },
          LATE_ARRIVED: { icon: "fa-clock", color: "text-yellow-500" },
          EXCUSED: { icon: "fa-info-circle", color: "text-blue-500" },
        };
        return (
          map[status] || { icon: "fa-question-circle", color: "text-gray-400" }
        );
      };

      /* ─── Badge Component ─── */
      const Badge = ({ text, className }) => (
        <span
          className={`text-[10px] px-2.5 py-1 rounded-full font-bold uppercase tracking-wider border ${className}`}
        >
          {text}
        </span>
      );

      /* ─── Custom Dropdown ─── */
      const CustomDropdown = ({ options, value, onChange }) => {
        const [isOpen, setIsOpen] = useState(false);
        const selectedOption = options[value];

        return (
          <div className="relative w-full max-w-md">
            <button
              type="button"
              onClick={() => setIsOpen(!isOpen)}
              className={`w-full bg-white rounded-3xl p-1 pr-6 flex items-center justify-between transition-all duration-300 border-2 ${isOpen ? "border-brand-500 ring-4 ring-brand-50 shadow-lg" : "border-gray-100 shadow-sm hover:border-gray-200"}`}
            >
              <div className="flex items-center gap-4">
                <div className="w-14 h-14 rounded-2xl bg-gradient-to-br from-brand-500 to-brand-700 text-white flex flex-col items-center justify-center shadow-lg shadow-brand-100">
                  <span className="text-[10px] font-black uppercase tracking-tighter leading-none mb-1 opacity-80">
                    Buổi
                  </span>
                  <span className="text-xl font-black leading-none">
                    {value + 1}
                  </span>
                </div>
                <div className="flex flex-col items-start">
                  <span className="text-[10px] text-gray-400 uppercase tracking-[0.2em] font-black mb-1">
                    Ngày học
                  </span>
                  <div className="flex items-center gap-2">
                    <span className="text-base font-black text-gray-800">
                      {fmtDate(selectedOption?.date)}
                    </span>
                    <span className="w-1.5 h-1.5 rounded-full bg-gray-200"></span>
                    <span className="text-xs font-bold text-gray-500">
                      {fmtTime(selectedOption?.startTime)}
                    </span>
                  </div>
                </div>
              </div>
              <div
                className={`w-10 h-10 rounded-2xl flex items-center justify-center transition-all ${isOpen ? "bg-brand-50 text-brand-600 rotate-180" : "bg-gray-50 text-gray-400 group-hover:text-brand-500"}`}
              >
                <i className="fas fa-chevron-down text-xs"></i>
              </div>
            </button>

            {isOpen && (
              <>
                <div
                  className="fixed inset-0 z-40"
                  onClick={() => setIsOpen(false)}
                ></div>
                <div className="absolute top-full left-0 right-0 mt-4 bg-white border border-gray-100 rounded-[32px] shadow-2xl z-50 overflow-hidden py-4 fade-in max-h-[450px] overflow-y-auto border border-brand-100/10">
                  <div className="px-6 pb-3 mb-3 border-b border-gray-50 flex items-center justify-between">
                    <span className="text-[11px] font-black text-gray-400 uppercase tracking-[0.15em]">
                      Chọn buổi học ({options.length})
                    </span>
                    <i className="fas fa-history text-gray-200 text-sm"></i>
                  </div>
                  <div className="px-2 space-y-1">
                    {options.map((opt, idx) => {
                      const isActive = idx === value;
                      const sa = opt.studentAttendance || [];
                      const needsReview = sa.filter(
                        (s) =>
                          !s.comment &&
                          [
                            "PRESENT",
                            "ATTENDED",
                            "LATE",
                            "LATE_ARRIVED",
                          ].includes(s.status),
                      ).length;

                      return (
                        <button
                          key={idx}
                          onClick={() => {
                            onChange(idx);
                            setIsOpen(false);
                          }}
                          className={`w-full px-4 py-4 rounded-[20px] flex items-center justify-between transition-all group ${isActive ? "bg-brand-600 text-white shadow-xl shadow-brand-100" : "text-gray-600 hover:bg-gray-50"}`}
                        >
                          <div className="flex items-center gap-4">
                            <div
                              className={`w-10 h-10 rounded-xl flex flex-col items-center justify-center transition-colors ${isActive ? "bg-white/20" : "bg-gray-100 group-hover:bg-brand-100"}`}
                            >
                              <span
                                className={`text-[8px] font-black uppercase tracking-tighter mb-0.5 ${isActive ? "text-white/60" : "text-gray-400 group-hover:text-brand-600"}`}
                              >
                                B
                              </span>
                              <span
                                className={`text-sm font-black leading-none ${isActive ? "text-white" : "text-gray-700 group-hover:text-brand-700"}`}
                              >
                                {idx + 1}
                              </span>
                            </div>
                            <div className="flex flex-col items-start">
                              <span
                                className={`text-sm font-black ${isActive ? "text-white" : "text-gray-800"}`}
                              >
                                {fmtDate(opt.date)}
                              </span>
                              <div
                                className={`flex items-center gap-1.5 text-[10px] font-bold ${isActive ? "text-white/60" : "text-gray-400"}`}
                              >
                                <i className="far fa-clock"></i>
                                {fmtTime(opt.startTime)} -{" "}
                                {fmtTime(opt.endTime)}
                              </div>
                            </div>
                          </div>
                          <div className="flex items-center gap-3">
                            {needsReview > 0 && (
                              <span
                                className={`px-2.5 py-1 rounded-lg text-[9px] font-black uppercase tracking-tighter border ${isActive ? "bg-white/20 border-white/30 text-white" : "bg-orange-50 border-orange-100 text-orange-600"}`}
                              >
                                {needsReview} Cần Review
                              </span>
                            )}
                            {isActive ? (
                              <i className="fas fa-check-circle text-white"></i>
                            ) : (
                              <i className="fas fa-chevron-right text-gray-200 text-[10px] opacity-0 group-hover:opacity-100 transform translate-x-[-10px] group-hover:translate-x-0 transition-all"></i>
                            )}
                          </div>
                        </button>
                      );
                    })}
                  </div>
                </div>
              </>
            )}
          </div>
        );
      };

      /* ─── Modal Component ─── */
      const Modal = ({ isOpen, onClose, title, children }) => {
        if (!isOpen) return null;
        return (
          <div className="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6">
            <div
              className="absolute inset-0 bg-gray-900/60 backdrop-blur-sm transition-opacity"
              onClick={onClose}
            ></div>
            <div className="bg-white rounded-[32px] shadow-2xl w-full max-w-5xl max-h-[90vh] overflow-hidden relative flex flex-col fade-in border border-white/20">
              <div className="px-6 py-5 border-b border-gray-100 flex items-center justify-between bg-white sticky top-0 z-10">
                <h3 className="text-xl font-extrabold text-gray-800 tracking-tight">
                  {title}
                </h3>
                <button
                  onClick={onClose}
                  className="w-10 h-10 rounded-2xl bg-gray-50 text-gray-400 hover:bg-red-50 hover:text-red-500 transition-all flex items-center justify-center border border-gray-100"
                >
                  <i className="fas fa-times text-lg"></i>
                </button>
              </div>
              <div className="flex-1 overflow-y-auto bg-gray-50/30">
                {children}
              </div>
            </div>
          </div>
        );
      };

      /* ─── Stat Card ─── */
      const StatCard = ({
        icon,
        label,
        value,
        color = "text-gray-800",
        sub,
      }) => (
        <div className="glass p-5 rounded-2xl border border-gray-100 shadow-sm">
          <div className="flex items-center gap-3 mb-2">
            <div
              className={`w-9 h-9 rounded-xl flex items-center justify-center ${color.replace("text-", "bg-").replace("800", "100").replace("700", "100").replace("600", "100").replace("500", "100")}`}
            >
              <i className={`fas ${icon} ${color} text-sm`}></i>
            </div>
            <p className="text-xs font-medium text-gray-400 uppercase tracking-wider">
              {label}
            </p>
          </div>
          <p className={`text-2xl font-bold ${color}`}>{value}</p>
          {sub && <p className="text-xs text-gray-400 mt-1">{sub}</p>}
        </div>
      );

      /* ─── Slot Detail Panel ─── */
      const SlotPanel = ({ slot, classId }) => {
        const [activeTab, setActiveTab] = useState("ALL");
        const students = slot.studentAttendance || [];

        const filteredStudents = useMemo(() => {
          if (activeTab === "ALL") return students;
          if (activeTab === "PENDING")
            return students.filter(
              (s) =>
                !s.comment &&
                ["PRESENT", "ATTENDED", "LATE", "LATE_ARRIVED"].includes(
                  s.status,
                ),
            );
          if (activeTab === "REVIEWED")
            return students.filter((s) => s.comment);
          if (activeTab === "ABSENT")
            return students.filter(
              (s) =>
                !["PRESENT", "ATTENDED", "LATE", "LATE_ARRIVED"].includes(
                  s.status,
                ),
            );
          return students;
        }, [students, activeTab]);

        const stats = useMemo(() => {
          const present = students.filter((s) =>
            ["PRESENT", "ATTENDED", "LATE", "LATE_ARRIVED"].includes(s.status),
          ).length;
          const commented = students.filter((s) => s.comment).length;
          const pending = students.filter(
            (s) =>
              !s.comment &&
              ["PRESENT", "ATTENDED", "LATE", "LATE_ARRIVED"].includes(
                s.status,
              ),
          ).length;
          const absent = students.length - present;

          return {
            present,
            commented,
            pending,
            absent,
            total: students.length,
          };
        }, [students]);

        return (
          <div className="bg-gray-50 rounded-2xl p-4 sm:p-6 fade-in border border-gray-100 shadow-inner">
            {/* Slot Header Info */}
            <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-4 mb-6">
              <div className="flex items-center gap-4">
                <div className="w-12 h-12 bg-white rounded-2xl flex items-center justify-center shadow-sm border border-gray-100">
                  <i className="fas fa-calendar-alt text-brand-600 text-lg"></i>
                </div>
                <div>
                  <h4 className="font-bold text-gray-800 text-base">
                    {fmtDate(slot.date)}
                  </h4>
                  <p className="text-xs text-gray-400 font-medium">
                    <i className="far fa-clock mr-1"></i>
                    {fmtTime(slot.startTime)} - {fmtTime(slot.endTime)}
                  </p>
                </div>
              </div>

              <div className="grid grid-cols-4 gap-2 sm:gap-4">
                <div className="text-center px-3 py-2 bg-white rounded-xl border border-gray-100 shadow-sm">
                  <p className="text-lg font-bold text-emerald-600 leading-none">
                    {stats.present}
                  </p>
                  <p className="text-[10px] text-gray-400 uppercase font-bold mt-1">
                    Có mặt
                  </p>
                </div>
                <div className="text-center px-3 py-2 bg-white rounded-xl border border-gray-100 shadow-sm">
                  <p className="text-lg font-bold text-orange-500 leading-none">
                    {stats.pending}
                  </p>
                  <p className="text-[10px] text-gray-400 uppercase font-bold mt-1">
                    Chờ review
                  </p>
                </div>
                <div className="text-center px-3 py-2 bg-white rounded-xl border border-gray-100 shadow-sm">
                  <p className="text-lg font-bold text-brand-600 leading-none">
                    {stats.commented}
                  </p>
                  <p className="text-[10px] text-gray-400 uppercase font-bold mt-1">
                    Đã xong
                  </p>
                </div>
                <div className="text-center px-3 py-2 bg-white rounded-xl border border-gray-100 shadow-sm">
                  <p className="text-lg font-bold text-gray-400 leading-none">
                    {stats.absent}
                  </p>
                  <p className="text-[10px] text-gray-400 uppercase font-bold mt-1">
                    Nghỉ học
                  </p>
                </div>
              </div>
            </div>

            {/* Lesson Summary */}
            {slot.summary && (
              <div className="bg-brand-50/50 rounded-2xl p-5 mb-6 border border-brand-100 relative overflow-hidden">
                <div className="absolute top-0 right-0 p-3 opacity-10">
                  <i className="fas fa-quote-right text-4xl text-brand-600"></i>
                </div>
                <div className="flex items-center gap-2 mb-3">
                  <div className="w-6 h-6 bg-brand-500 text-white rounded-lg flex items-center justify-center text-[10px]">
                    <i className="fas fa-file-alt"></i>
                  </div>
                  <p className="text-xs text-brand-700 uppercase font-extrabold tracking-wider">
                    Nội dung & Đánh giá buổi học
                  </p>
                </div>
                <div
                  className="lms-content text-gray-700 bg-white/60 p-4 rounded-xl border border-white/80"
                  dangerouslySetInnerHTML={{ __html: slot.summary }}
                />
              </div>
            )}

            {/* Student List Tabs */}
            {students.length > 0 ? (
              <div className="space-y-4">
                <div className="flex items-center justify-between border-b border-gray-200 mb-2">
                  <div className="flex gap-1 overflow-x-auto no-scrollbar">
                    {[
                      { id: "ALL", label: "Tất cả", count: students.length },
                      {
                        id: "PENDING",
                        label: "Chờ review",
                        count: stats.pending,
                        color: "text-orange-600",
                      },
                      {
                        id: "REVIEWED",
                        label: "Đã xong",
                        count: stats.commented,
                      },
                      { id: "ABSENT", label: "Nghỉ học", count: stats.absent },
                    ].map((t) => (
                      <button
                        key={t.id}
                        onClick={() => setActiveTab(t.id)}
                        className={`px-4 py-3 text-xs font-bold whitespace-nowrap border-b-2 transition-all flex items-center gap-2 ${activeTab === t.id ? "border-brand-600 text-brand-600" : "border-transparent text-gray-400 hover:text-gray-600"}`}
                      >
                        {t.label}
                        <span
                          className={`px-1.5 py-0.5 rounded-md text-[10px] ${activeTab === t.id ? "bg-brand-100 text-brand-700" : "bg-gray-100 text-gray-500"}`}
                        >
                          {t.count}
                        </span>
                      </button>
                    ))}
                  </div>
                </div>

                <div className="grid grid-cols-1 gap-4">
                  {filteredStudents.length > 0 ? (
                    filteredStudents.map((sa, i) => {
                      const ai = attendanceIcon(sa.status);
                      const hasComment = !!sa.comment;
                      const attended = [
                        "PRESENT",
                        "ATTENDED",
                        "LATE",
                        "LATE_ARRIVED",
                      ].includes(sa.status);

                      return (
                        <div
                          key={sa._id || i}
                          className="bg-white rounded-2xl border border-gray-100 overflow-hidden shadow-sm hover:shadow-md hover:border-brand-200 transition-all group"
                        >
                          <div className="flex flex-col sm:flex-row">
                            {/* Student Sidebar */}
                            <div className="sm:w-56 bg-gray-50/30 p-4 border-b sm:border-b-0 sm:border-r border-gray-100 flex flex-row sm:flex-col justify-between items-center sm:items-start gap-4">
                              <div className="flex items-center sm:items-start gap-3 sm:flex-col">
                                <div className="relative">
                                  <div className="w-12 h-12 rounded-2xl bg-gradient-to-br from-brand-100 to-brand-200 text-brand-700 flex items-center justify-center font-bold text-lg shadow-sm">
                                    {sa.student?.fullName?.charAt(0) || "?"}
                                  </div>
                                  <div
                                    className={`absolute -bottom-1 -right-1 w-5 h-5 rounded-lg bg-white border-2 border-white shadow-sm flex items-center justify-center`}
                                  >
                                    <i
                                      className={`fas ${ai.icon} ${ai.color} text-[8px]`}
                                    ></i>
                                  </div>
                                </div>
                                <div className="text-left">
                                  <p className="font-bold text-gray-800 text-sm group-hover:text-brand-600 transition-colors">
                                    {sa.student?.fullName || sa.studentId}
                                  </p>
                                  <p className="text-[10px] text-gray-400 mt-0.5 flex items-center gap-1 font-medium">
                                    <i className="far fa-id-badge"></i>
                                    {sa.student?.id || sa.studentId}
                                  </p>
                                </div>
                              </div>

                              <div className="flex flex-col items-end sm:items-start gap-2">
                                <div
                                  className={`flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl bg-white border border-gray-100 shadow-sm`}
                                >
                                  <span
                                    className={`w-1.5 h-1.5 rounded-full ${ai.color.replace("text-", "bg-")}`}
                                  ></span>
                                  <span className="text-[10px] font-extrabold text-gray-600 tracking-tight">
                                    {sa.status}
                                  </span>
                                </div>
                                {sa.sendCommentStatus === "SENT" ? (
                                  <Badge
                                    text="Đã gửi LMS"
                                    className="bg-emerald-100 text-emerald-600 border border-emerald-200"
                                  />
                                ) : sa.sendCommentStatus ? (
                                  <Badge
                                    text={sa.sendCommentStatus}
                                    className="bg-yellow-100 text-yellow-600 border border-yellow-200"
                                  />
                                ) : null}
                              </div>
                            </div>

                            {/* Comment Area */}
                            <div className="flex-1 p-5 lg:p-6 bg-white">
                              <div className="flex items-center justify-between mb-4">
                                <div className="flex items-center gap-2">
                                  <div className="w-7 h-7 bg-brand-50 rounded-lg flex items-center justify-center">
                                    <i className="fas fa-comment-dots text-brand-500 text-xs"></i>
                                  </div>
                                  <span className="text-[10px] font-black text-gray-400 uppercase tracking-[0.15em]">
                                    Nhận xét cá nhân
                                  </span>
                                </div>
                                {hasComment && (
                                  <button
                                    onClick={() => {
                                      const text = sa.comment.replace(
                                        /<[^>]*>/g,
                                        "",
                                      );
                                      navigator.clipboard.writeText(text);
                                    }}
                                    className="text-[10px] font-bold text-brand-600 hover:text-white hover:bg-brand-600 flex items-center gap-2 bg-brand-50 px-3 py-1.5 rounded-lg transition-all border border-brand-100"
                                  >
                                    <i className="fas fa-copy"></i>
                                    Copy Nhận xét
                                  </button>
                                )}
                              </div>
                              <div

      /* ─── Class Card (Simplified) ─── */
      const ClassCard = ({ cls, onClick }) => {
        const slots = cls.slots || [];
        const totalStudentsAttended = slots.reduce(
          (sum, s) =>
            sum +
            (s.studentAttendance || []).filter((sa) =>
              ["PRESENT", "ATTENDED", "LATE", "LATE_ARRIVED"].includes(
                sa.status,
              ),
            ).length,
          0,

        const totalComments = slots.reduce(
          (sum, s) =>
            sum +
            (s.studentAttendance?.filter((sa) => sa.comment)?.length || 0),
          0,
        );
        const reviewRate =
          totalStudentsAttended > 0
            ? Math.min(
                100,
                Math.round((totalComments / totalStudentsAttended) * 100),
              )
            : 0;

        return (
          <div
            onClick={onClick}
            className="group bg-white rounded-[24px] border border-gray-100 p-5 shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all cursor-pointer relative overflow-hidden flex flex-col justify-between h-full min-h-[180px]"

      /* ─── Class Detail Modal (Tabs) ─── */
      const ClassDetailModal = ({ cls, isOpen, onClose }) => {
        const [activeTab, setActiveTab] = useState("ATTENDANCE");
        const [activeSlot, setActiveSlot] = useState(null);

        const students = useMemo(() => {
          if (!cls) return [];
          const map = new Map();
          cls.slots?.forEach((s) => {
            s.studentAttendance?.forEach((sa) => {
              if (!map.has(sa.studentId)) {
                map.set(sa.studentId, {
                  ...sa.student,
                  id: sa.studentId,
                  attendedCount: 0,
                  totalCount: 0,
                });
              }
              const info = map.get(sa.studentId);
              info.totalCount++;
              if (
                ["PRESENT", "ATTENDED", "LATE", "LATE_ARRIVED"].includes(
                  sa.status,
                )
              ) {
                info.attendedCount++;
              }
            });
          });
          return Array.from(map.values()).sort((a, b) =>
            a.fullName?.localeCompare(b.fullName),
          );
        }, [cls]);

        const chronologicalSlots = useMemo(
          () =>
            cls

                  (a, b) => new Date(a.date) - new Date(b.date),

                  { id: "STUDENTS", label: "Học sinh", icon: "fa-users" },
                  { id: "ATTENDANCE", label: "Điểm danh", icon: "fa-calendar" },

                  <button
                    key={t.id}
                    onClick={() => setActiveTab(t.id)}
                    className={`flex items-center gap-2 py-4 text-sm font-bold border-b-2 transition-all whitespace-nowrap ${activeTab === t.id ? "border-brand-600 text-brand-600" : "border-transparent text-gray-400 hover:text-gray-600"}`}
                  >
                    <i className={`fas ${t.icon} text-xs`}></i>
                    {t.label}
                  </button>
                ))}
              </div>
            </div>

            <div className="p-6">
              {activeTab === "STUDENTS" && (
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 fade-in">
                  {students.map((s) => (
                    <div
                      key={s.id}
                      className="bg-white p-4 rounded-2xl border border-gray-100 flex items-center gap-4 shadow-sm"
                    >
                      <div className="w-12 h-12 rounded-xl bg-brand-50 text-brand-600 flex items-center justify-center font-bold text-lg">
                        {s.fullName?.charAt(0) || "?"}
                      </div>
                      <div className="flex-1">
                        <p className="font-bold text-gray-800">{s.fullName}</p>

                      <div className="text-right">

                    </div>

                </div>

              {activeTab === "ATTENDANCE" && (
                <div className="space-y-6 fade-in min-h-[500px]">
                  {/* Custom Session Dropdown */}
                  <CustomDropdown

                      activeSlot !== null

                  {/* Active Slot Panel */}
                  <div className="slide-down relative z-10">
                    {chronologicalSlots[

              {activeTab === "REVIEWS" && (
                <div className="space-y-6 fade-in">
                  {reverseSlots.filter((s) => new Date(s.date) <= new Date())
                    .length === 0 ? (
                    <div className="text-center py-20 bg-white rounded-3xl border border-dashed border-gray-200">
                      <p className="text-gray-400 italic">
                        Chưa có buổi học nào cần nhận xét.
                      </p>
                    </div>
                  ) : (
                    reverseSlots
                      .filter((s) => new Date(s.date) <= new Date())
                      .map((slot, idx) => {
                        const sa = slot.studentAttendance || [];
                        const pending = sa.filter(
                          (s) =>
                            !s.comment &&
                            [
                              "PRESENT",
                              "ATTENDED",
                              "LATE",
                              "LATE_ARRIVED",
                            ].includes(s.status),

                            <div className="px-6 py-4 bg-orange-50/30 border-b border-orange-100 flex items-center justify-between">
                              <h4 className="font-black text-orange-700 text-sm">
                                {fmtDate(slot.date)} • {pending} Học sinh chưa
                                nhận xét

                              <span className="text-[10px] text-orange-400 font-bold">
                                {fmtTime(slot.startTime)}
                              </span>
                            </div>
                            <div className="p-2">
                              <SlotPanel slot={slot} classId={cls.id} />

                      })
                  )}
                </div>
              )}

              {activeTab === "GRADING" && (
                <div className="text-center py-32 fade-in">
                  <div className="w-20 h-20 bg-gray-50 rounded-full flex items-center justify-center mx-auto mb-6">
                    <i className="fas fa-tools text-gray-200 text-4xl"></i>
                  </div>
                  <h3 className="text-xl font-black text-gray-800">
                    Chế độ Bài tập & Chấm điểm
                  </h3>
                  <p className="text-gray-400 max-w-sm mx-auto mt-2 text-sm leading-relaxed">
                    Tính năng đang được phát triển để đồng bộ dữ liệu bài tập và
                    grading từ MindX LMS Gateway.
                  </p>
                </div>
              )}
            </div>
          </Modal>

      /* ─── Login Page ─── */
      const LoginPage = ({ onLogin, sessions }) => {

      /* ─── Dashboard Page ─── */
      const DashboardPage = ({ user, onLogout }) => {
        const [classes, setClasses] = useState([]);
        const [loading, setLoading] = useState(true);
        const [error, setError] = useState(null);
        const [teacherId, setTeacherId] = useState(null);
        const [profile, setProfile] = useState(null);
        const [filter, setFilter] = useState("ALL");
        const [search, setSearch] = useState("");
        const [mainTab, setMainTab] = useState("CLASSES"); // CLASSES, REVIEWS
        const [selectedClass, setSelectedClass] = useState(null);

        useEffect(() => {
          loadData();
        }, []);

        const loadData = async () => {
          setLoading(true);
          setError(null);
          try {
            // Step 1: Get teacher ID
            const profileRes = await api("/api/test-token", {
              token: user.lmsToken,
              userId: user.mindxUser.id,
            });
            if (!profileRes.success)
              throw new Error(
                profileRes.error?.message ||
                  profileRes.error ||
                  "Không lấy được Teacher ID",
              );

            setTeacherId(profileRes.teacherId);
            setProfile(profileRes.profile);

            // Step 2: Get classes
            const classRes = await api("/api/classes", {
              token: user.lmsToken,
              teacherId: profileRes.teacherId,
            });
            if (classRes.success) setClasses(classRes.data || []);
            else
              throw new Error(classRes.error || "Không lấy được danh sách lớp");
          } catch (err) {
            setError(typeof err === "string" ? err : err.message);
          } finally {
            setLoading(false);
          }
        };

        // Stats
        const runningClasses = classes.filter(
          (c) => c.status === "RUNNING",
        ).length;
        const totalSlots = classes.reduce(
          (sum, c) => sum + (c.slots?.length || 0),
          0,
        );
        const totalStudents = classes.reduce((sum, c) => {
          const uniqueIds = new Set();
          c.slots?.forEach((s) =>
            s.studentAttendance?.forEach((sa) => uniqueIds.add(sa.studentId)),
          );
          return sum + uniqueIds.size;
        }, 0);
        const pendingReviews = classes.reduce((sum, c) => {
          const now = new Date();
          return (
            sum +
            (c.slots || []).reduce((s2, slot) => {
              // Only count reviews for slots that have already happened
              if (new Date(slot.date) > now) return s2;
              return (
                s2 +
                (slot.studentAttendance || []).filter(
                  (sa) =>
                    !sa.comment &&
                    ["PRESENT", "ATTENDED", "LATE", "LATE_ARRIVED"].includes(
                      sa.status,
                    ),
                ).length
              );
            }, 0)
          );
        }, 0);

        // Filters
        const statuses = [
          "ALL",
          ...new Set(classes.map((c) => c.status).filter(Boolean)),
        ];
        const filtered = classes.filter((c) => {
          if (filter !== "ALL" && c.status !== filter) return false;
          if (
            search &&
            !c.name.toLowerCase().includes(search.toLowerCase()) &&
            !c.course?.name?.toLowerCase().includes(search.toLowerCase())
          )
            return false;
          return true;
        });

        const allPendingSlots = useMemo(() => {
          const now = new Date();
          const list = [];
          classes.forEach((c) => {
            if (c.status !== "RUNNING" && c.status !== "ACTIVE") return;
            (c.slots || []).forEach((s) => {
              if (new Date(s.date) > now) return;
              const pendingCount = (s.studentAttendance || []).filter(
                (sa) =>
                  !sa.comment &&
                  ["PRESENT", "ATTENDED", "LATE", "LATE_ARRIVED"].includes(
                    sa.status,
                  ),
              ).length;
              if (pendingCount > 0) {
                list.push({ ...s, class: c, pendingCount });
              }
            });
          });
          return list.sort((a, b) => new Date(b.date) - new Date(a.date));
        }, [classes]);

        return (
          <div className="min-h-screen">
            {/* Top Bar */}
            <header className="glass border-b border-gray-100 sticky top-0 z-20 shadow-sm">
              <div className="max-w-7xl mx-auto px-4 lg:px-8 h-16 flex items-center justify-between">
                <div className="flex items-center gap-3">
                  <div className="w-9 h-9 bg-gradient-to-br from-brand-500 to-brand-700 text-white rounded-xl flex items-center justify-center shadow-md">
                    <i className="fas fa-graduation-cap text-sm"></i>
                  </div>
                  <div className="hidden sm:block">
                    <h1 className="font-bold text-gray-800 text-sm leading-tight">
                      MindX LMS
                    </h1>
                    <p className="text-[10px] text-brand-600 font-semibold tracking-widest uppercase">
                      Teacher Dashboard
                    </p>
                  </div>
                </div>

                <div className="flex items-center gap-3">
                  <div className="text-right">
                    <p className="text-sm font-bold text-gray-800">
                      {profile?.username || user.mindxUser?.username}
                    </p>
                    <p className="text-[10px] text-gray-400">
                      {profile?.email || user.mindxUser?.email}
                    </p>
                  </div>
                  <div className="w-9 h-9 rounded-xl bg-brand-100 text-brand-700 flex items-center justify-center font-bold text-sm">
                    {(profile?.username || user.mindxUser?.username || "?")
                      .charAt(0)
                      .toUpperCase()}
                  </div>
                  <button
                    onClick={onLogout}
                    className="w-9 h-9 rounded-xl bg-gray-100 text-gray-400 hover:bg-red-50 hover:text-red-500 transition flex items-center justify-center"
                    title="Đăng xuất"
                  >
                    <i className="fas fa-sign-out-alt text-sm"></i>
                  </button>
                </div>
              </div>
            </header>

            <main className="max-w-7xl mx-auto px-4 lg:px-8 py-6 space-y-6">
              {/* Error */}
              {error && (
                <div className="bg-red-50 border border-red-100 rounded-2xl p-4 flex items-center gap-3 fade-in">
                  <i className="fas fa-exclamation-circle text-red-500"></i>
                  <div className="flex-1">
                    <p className="text-sm font-semibold text-red-700">Lỗi</p>
                    <p className="text-xs text-red-500">{error}</p>
                  </div>
                  <button
                    onClick={loadData}
                    className="text-xs font-bold text-red-600 hover:text-red-800 underline"
                  >
                    Thử lại
                  </button>
                </div>
              )}

              {/* Main Navigation Tabs */}
              <div className="flex bg-white p-1 rounded-2xl border border-gray-100 shadow-sm w-fit">
                <button
                  onClick={() => setMainTab("CLASSES")}
                  className={`flex items-center gap-2 px-6 py-2.5 rounded-xl text-sm font-bold transition-all ${mainTab === "CLASSES" ? "bg-brand-600 text-white shadow-md shadow-brand-100" : "text-gray-400 hover:text-gray-600"}`}
                >
                  <i className="fas fa-book"></i>
                  Lớp học
                </button>
                <button
                  onClick={() => setMainTab("REVIEWS")}
                  className={`flex items-center gap-2 px-6 py-2.5 rounded-xl text-sm font-bold transition-all relative ${mainTab === "REVIEWS" ? "bg-brand-600 text-white shadow-md shadow-brand-100" : "text-gray-400 hover:text-gray-600"}`}
                >
                  <i className="fas fa-star"></i>
                  Cần Review
                  {pendingReviews > 0 && (
                    <span className="absolute -top-1 -right-1 flex h-4 w-4">
                      <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                      <span className="relative inline-flex rounded-full h-4 w-4 bg-red-500 text-[8px] text-white items-center justify-center border border-white">
                        {pendingReviews}
                      </span>
                    </span>
                  )}
                </button>
              </div>

              {mainTab === "CLASSES" ? (
                <div className="space-y-6 fade-in">
                  {/* Stats Row */}
                  <div className="grid grid-cols-2 lg:grid-cols-5 gap-4">
                    <StatCard
                      icon="fa-chalkboard-teacher"
                      label="Tổng lớp"
                      value={classes.length}
                      color="text-brand-600"
                    />
                    <StatCard
                      icon="fa-play-circle"
                      label="Đang dạy"
                      value={runningClasses}
                      color="text-emerald-600"
                    />
                    <StatCard
                      icon="fa-calendar-check"
                      label="Tổng buổi"
                      value={totalSlots}
                      color="text-purple-600"
                    />
                    <StatCard
                      icon="fa-user-graduate"
                      label="Học sinh"
                      value={totalStudents}
                      color="text-orange-600"
                    />
                    <StatCard
                      icon="fa-pen"
                      label="Cần review"
                      value={pendingReviews}
                      color={
                        pendingReviews > 0 ? "text-red-600" : "text-emerald-600"
                      }
                      sub={
                        pendingReviews > 0
                          ? "Học sinh chưa có nhận xét"
                          : "Hoàn thành!"
                      }
                    />
                  </div>

                  {/* Filter / Search */}
                  <div className="flex flex-col sm:flex-row gap-3 items-start sm:items-center justify-between">
                    <div className="flex items-center gap-2 flex-wrap">
                      {statuses.map((s) => (
                        <button
                          key={s}
                          onClick={() => setFilter(s)}
                          className={`text-xs px-3 py-1.5 rounded-lg font-semibold transition ${filter === s ? "bg-brand-600 text-white shadow-md" : "bg-white text-gray-500 border border-gray-200 hover:border-brand-300"}`}
                        >
                          {s === "ALL" ? "Tất cả" : s}{" "}
                          {s !== "ALL" &&
                            `(${classes.filter((c) => c.status === s).length})`}
                        </button>
                      ))}
                    </div>
                    <div className="relative w-full sm:w-64">
                      <span className="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-300">
                        <i className="fas fa-search text-xs"></i>
                      </span>
                      <input
                        value={search}
                        onChange={(e) => setSearch(e.target.value)}
                        className="block w-full pl-9 pr-4 py-2 bg-white border border-gray-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition"
                        placeholder="Tìm lớp..."
                      />
                    </div>
                  </div>

                  {/* Class List */}
                  {loading ? (
                    <div className="flex flex-col items-center justify-center py-20">
                      <i className="fas fa-circle-notch fa-spin text-4xl text-brand-500 mb-4"></i>
                      <p className="text-gray-400 font-medium">
                        Đang tải dữ liệu lớp học...
                      </p>
                    </div>
                  ) : filtered.length > 0 ? (
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                      {filtered.map((cls) => (
                        <ClassCard
                          key={cls.id}
                          cls={cls}
                          onClick={() => setSelectedClass(cls)}
                        />
                      ))}
                    </div>
                  ) : (
                    <div className="text-center py-20 glass rounded-2xl border border-dashed border-gray-200">
                      <i className="fas fa-inbox text-5xl text-gray-200 mb-4"></i>
                      <p className="text-gray-400 font-medium">
                        {search || filter !== "ALL"
                          ? "Không tìm thấy lớp phù hợp"
                          : "Chưa có lớp học nào"}
                      </p>
                    </div>
                  )}
                </div>
              ) : (
                <div className="space-y-6 fade-in">
                  <div className="glass p-6 rounded-3xl border border-brand-100 flex flex-col sm:flex-row items-center justify-between gap-4">
                    <div>
                      <h2 className="text-xl font-bold text-gray-800">
                        Danh sách cần Review
                      </h2>
                      <p className="text-sm text-gray-500">
                        Tổng cộng {pendingReviews} học sinh chưa được nhận xét
                        từ {allPendingSlots.length} buổi học.
                      </p>
                    </div>
                    <div className="w-16 h-16 bg-red-50 text-red-500 rounded-2xl flex items-center justify-center text-2xl shadow-inner">
                      <i className="fas fa-clipboard-check"></i>
                    </div>
                  </div>

                  {allPendingSlots.length > 0 ? (
                    <div className="space-y-6">
                      {allPendingSlots.map((slot, idx) => (
                        <div
                          key={idx}
                          className="glass rounded-3xl border border-gray-100 overflow-hidden shadow-sm"
                        >
                          <div className="bg-brand-50/30 px-6 py-4 border-b border-gray-50 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                            <div>
                              <div className="flex items-center gap-2 mb-1">
                                <span className="text-[10px] bg-brand-600 text-white px-2 py-0.5 rounded-full font-bold">
                                  {slot.class.name}
                                </span>
                                <span className="text-[10px] bg-orange-100 text-orange-600 px-2 py-0.5 rounded-full font-bold">
                                  {slot.pendingCount} học sinh cần review
                                </span>
                              </div>
                              <h3 className="font-bold text-gray-800">
                                {fmtDate(slot.date)} • {slot.class.course?.name}
                              </h3>
                            </div>
                            <div className="text-right">
                              <p className="text-xs text-gray-400 font-medium">
                                {fmtTime(slot.startTime)} -{" "}
                                {fmtTime(slot.endTime)}
                              </p>
                            </div>
                          </div>
                          <div className="p-2">
                            <SlotPanel slot={slot} classId={slot.class.id} />
                          </div>
                        </div>
                      ))}
                    </div>
                  ) : (
                    <div className="text-center py-20 bg-white rounded-3xl border border-dashed border-gray-200">
                      <div className="w-20 h-20 bg-emerald-50 text-emerald-500 rounded-full flex items-center justify-center mx-auto mb-6 text-3xl">
                        <i className="fas fa-check-double"></i>
                      </div>
                      <h3 className="text-lg font-bold text-gray-800">
                        Tuyệt vời!
                      </h3>
                      <p className="text-gray-400 max-w-xs mx-auto mt-1">
                        Tất cả học sinh đã được nhận xét. Không còn buổi học nào
                        đang chờ review.
                      </p>
                    </div>
                  )}
                </div>
              )}

              {/* Class Detail Modal */}
              <ClassDetailModal
                cls={selectedClass}
                isOpen={!!selectedClass}
                onClose={() => setSelectedClass(null)}
              />
            </main>

            <footer className="max-w-7xl mx-auto px-4 lg:px-8 py-8 text-center">
              <p className="text-[10px] text-gray-300 font-semibold tracking-[.2em] uppercase">
                MindX Education © 2026 • Teacher Support Tool
              </p>
            </footer>
          </div>
        );
      };

      /* ─── App Root ─── */
      const App = () => {
        const [user, setUser] = useState(null);
        const [sessions, setSessions] = useState({});
        const [authChecking, setAuthChecking] = useState(true);

        // Auto login on load
        useEffect(() => {
          const stored = localStorage.getItem("mindx_lms_user");
          if (stored) {
            try {
              const parsed = JSON.parse(stored);
              // Test token validity or refresh if expired
              api("/api/test-token", {
                token: parsed.lmsToken,
                userId: parsed.mindxUser?.id,
              })
                .then((res) => {
                  if (res.success) {
                    setUser(parsed);
                    setAuthChecking(false);
                  } else if (parsed.lmsRefreshToken) {
                    // Attempt token refresh
                    api("/api/refresh-token", {
                      refreshToken: parsed.lmsRefreshToken,
                    }).then((refRes) => {
                      if (refRes.success) {
                        const updated = {
                          ...parsed,
                          lmsToken: refRes.lmsToken,
                          lmsRefreshToken:
                            refRes.lmsRefreshToken || parsed.lmsRefreshToken,
                        };
                        localStorage.setItem(
                          "mindx_lms_user",
                          JSON.stringify(updated),
                        );
                        setUser(updated);
                      } else {
                        localStorage.removeItem("mindx_lms_user");
                      }
                      setAuthChecking(false);
                    });
                  } else {
                    localStorage.removeItem("mindx_lms_user");
                    setAuthChecking(false);
                  }
                })
                .catch(() => {
                  // If offline or network err, trust local storage temporarily
                  setUser(parsed);
                  setAuthChecking(false);
                });
            } catch {
              localStorage.removeItem("mindx_lms_user");
              setAuthChecking(false);
            }
          } else {
            setAuthChecking(false);
          }

          api("/api/sessions").then((d) => {
            if (d.success) setSessions(d.data);
          });
        }, []);

        const handleLoginSuccess = (userData) => {
          localStorage.setItem("mindx_lms_user", JSON.stringify(userData));
          setUser(userData);
        };

        if (authChecking) {
          return (
            <div className="min-h-screen flex flex-col items-center justify-center bg-slate-50">
              <i className="fas fa-circle-notch fa-spin text-4xl text-brand-600 mb-4"></i>
              <p className="text-gray-400 font-bold text-sm tracking-wider uppercase">
                Đang xác thực phiên làm việc...
              </p>
            </div>
          );
        }

        if (!user)
          return <LoginPage onLogin={handleLoginSuccess} sessions={sessions} />;
        return (
          <DashboardPage
            user={user}
            onLogout={() => {
              localStorage.removeItem("mindx_lms_user");
              setUser(null);
              window.location.reload();
            }}
          />
        );
      };

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
