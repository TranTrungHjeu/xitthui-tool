image: docker:24.0.5

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  # Docker images naming
  BACKEND_IMAGE: $CI_REGISTRY_IMAGE/backend
  FRONTEND_IMAGE: $CI_REGISTRY_IMAGE/frontend

services:
  - docker:24.0.5-dind

stages:
  - build
  - deploy

# Template for Docker login and lowercase image names
.docker_setup:
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - export BACKEND_IMAGE_LOWER=$(echo "$BACKEND_IMAGE" | tr '[:upper:]' '[:lower:]')
    - export FRONTEND_IMAGE_LOWER=$(echo "$FRONTEND_IMAGE" | tr '[:upper:]' '[:lower:]')

build:
  stage: build
  extends: .docker_setup
  script:
    # Build & Push Backend
    - docker build
      --pull
      --cache-from $BACKEND_IMAGE_LOWER:latest
      --tag $BACKEND_IMAGE_LOWER:$CI_COMMIT_SHORT_SHA
      --tag $BACKEND_IMAGE_LOWER:latest
      -f ./backend/Dockerfile ./backend
    - docker push $BACKEND_IMAGE_LOWER:$CI_COMMIT_SHORT_SHA
    - docker push $BACKEND_IMAGE_LOWER:latest

    # Build & Push Frontend
    - docker build
      --pull
      --no-cache
      --build-arg NEXT_PUBLIC_API_URL="$CI_FRONTEND_API_URL"
      --tag $FRONTEND_IMAGE_LOWER:$CI_COMMIT_SHORT_SHA
      --tag $FRONTEND_IMAGE_LOWER:latest
      -f ./frontend/Dockerfile ./frontend
    - docker push $FRONTEND_IMAGE_LOWER:$CI_COMMIT_SHORT_SHA
    - docker push $FRONTEND_IMAGE_LOWER:latest
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - printf "%s" "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - eval $(ssh-agent -s)
    - ssh-add ~/.ssh/id_rsa
  script:
    - ssh -o StrictHostKeyChecking=no "$VPS_USER"@"$VPS_HOST" "
      cd $VPS_DEPLOY_PATH &&
      docker login -u \"$CI_REGISTRY_USER\" -p \"$CI_REGISTRY_PASSWORD\" \"$CI_REGISTRY\" &&
      docker compose pull &&
      docker compose up -d --remove-orphans &&
      docker image prune -f
      "
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  environment:
    name: production
    url: http://$VPS_HOST
